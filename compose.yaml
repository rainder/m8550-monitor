services:
  collector:
    build: ./collector
    image: m8550-collector:dev
    volumes:
      - ./data:/data
    environment:
      - M8550_HOST=${M8550_HOST:-http://192.168.1.1}
      - M8550_PASSWORD=${M8550_PASSWORD}
      - DB_PATH=/data/m8550.db
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - AUTH_BACKOFF_SECONDS=${AUTH_BACKOFF_SECONDS:-300}
      - STALE_SESSION_THRESHOLD=${STALE_SESSION_THRESHOLD:-4}
      - SMS_POLL_INTERVAL=${SMS_POLL_INTERVAL:-60}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
    restart: unless-stopped

  web:
    build: ./web
    image: m8550-web:dev
    ports:
      - "${WEB_PORT:-3000}:3000"
    # Run as uid 1000 to match the collector — both containers need write access
    # to ./data so SQLite can create -shm/-wal sidecars. The image's default
    # nextjs user (uid 1001) cannot write to a host data dir owned by uid 1000.
    user: "1000:1000"
    # NOT :ro — SQLite WAL mode needs to write -shm/-wal sidecars into the
    # data dir even for readers. Read-only is enforced at the application
    # layer in web/lib/db.ts (`new Database(path, { readonly: true })`).
    volumes:
      - ./data:/data
    environment:
      - DB_PATH=/data/m8550.db
    restart: unless-stopped
    depends_on:
      - collector
