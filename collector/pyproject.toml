[project]
name = "m8550-collector"
version = "0.1.0"
description = "TP-Link M8550 stats collector"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "tplinkrouterc6u>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
m8550-collector = "m8550_collector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m8550_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
